name: vrt

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout checked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated VRT manifest
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/src/presentation/previews/vrt_previews.g.dart

      - name: Analyze
        run: flutter analyze

  vrt_push:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout push commit
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate VRT screenshots
        run: flutter test test/vrt/previews_vrt_test.dart --update-goldens

  vrt_pr:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      VRT_REPORT_DIR: /tmp/vrt-report
      VRT_ASSETS_BRANCH: vrt/screenshot-reports
      VRT_ASSETS_ROOT: vrt

    steps:
      - name: Checkout PR base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install PR base dependencies
        run: flutter pub get

      - name: Generate PR base VRT screenshots
        run: |
          rm -rf "$VRT_REPORT_DIR"
          mkdir -p "$VRT_REPORT_DIR/base" "$VRT_REPORT_DIR/head" "$VRT_REPORT_DIR/diff"
          flutter test test/vrt/previews_vrt_test.dart --update-goldens
          find test -path '*/ci/*.png' -exec cp {} "$VRT_REPORT_DIR/base/" \;

      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install PR head dependencies
        run: flutter pub get

      - name: Generate PR head VRT screenshots
        run: |
          flutter test test/vrt/previews_vrt_test.dart --update-goldens
          find test -path '*/ci/*.png' -exec cp {} "$VRT_REPORT_DIR/head/" \;

      - name: Compare PR base and head VRT screenshots
        run: dart run tool/compare_vrt_images.dart "$VRT_REPORT_DIR/head" "$VRT_REPORT_DIR/base" "$VRT_REPORT_DIR/diff" -J "$VRT_REPORT_DIR/reg.json"

      - name: Collect VRT comparison counts
        id: vrt_report_summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.VRT_REPORT_DIR, 'reg.json'), 'utf8'),
          );
          const failed = report.failedItems?.length ?? 0;
          const added = report.newItems?.length ?? 0;
          const deleted = report.deletedItems?.length ?? 0;
          const passed = report.passedItems?.length ?? 0;
          const changed = failed + added + deleted;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `added=${added}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deleted=${deleted}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_diff=${changed > 0}\n`);
          NODE

      - name: Publish inline VRT assets
        if: >
          steps.vrt_report_summary.outputs.has_diff == 'true'
        id: publish_vrt_assets
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          relative_path="pr-${PR_NUMBER}/${short_sha}"
          publish_root="${RUNNER_TEMP}/vrt-assets-branch"

          rm -rf "$publish_root"

          if git ls-remote --exit-code --heads origin "$VRT_ASSETS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$VRT_ASSETS_BRANCH" --depth=1
            git worktree add "$publish_root" FETCH_HEAD
          else
            git worktree add --detach "$publish_root"
            cd "$publish_root"
            git switch --orphan "$VRT_ASSETS_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi

          target_dir="$publish_root/$VRT_ASSETS_ROOT/$relative_path"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"

          for kind in base head diff; do
            if [ -d "$VRT_REPORT_DIR/$kind" ]; then
              while IFS= read -r -d '' file; do
                cp "$file" "$target_dir/${kind}_$(basename "$file")"
              done < <(find "$VRT_REPORT_DIR/$kind" -maxdepth 1 -type f -name '*.png' -print0)
            fi
          done

          cd "$publish_root"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VRT_ASSETS_ROOT"

          if ! git diff --cached --quiet; then
            git commit -m "Update VRT images for PR #${PR_NUMBER} ${short_sha} [skip ci]"
            git push origin "HEAD:$VRT_ASSETS_BRANCH"
          fi

          echo "url=https://github.com/${REPOSITORY}/tree/${VRT_ASSETS_BRANCH}/${VRT_ASSETS_ROOT}/${relative_path}" >> "$GITHUB_OUTPUT"
          echo "asset_base_url=https://raw.githubusercontent.com/${REPOSITORY}/refs/heads/${VRT_ASSETS_BRANCH}/${VRT_ASSETS_ROOT}/${relative_path}" >> "$GITHUB_OUTPUT"

      - name: Add VRT workflow summary
        run: |
          echo "### スクリーンショット差分" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.vrt_report_summary.outputs.has_diff }}" = "true" ]; then
            echo "- **結果: 差分あり**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **結果: 差分なし**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.publish_vrt_assets.outputs.url }}" ]; then
            echo "- VRT assets: ${{ steps.publish_vrt_assets.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- 変更: ${{ steps.vrt_report_summary.outputs.failed }}件 / 追加: ${{ steps.vrt_report_summary.outputs.added }}件 / 削除: ${{ steps.vrt_report_summary.outputs.deleted }}件 / 一致: ${{ steps.vrt_report_summary.outputs.passed }}件" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ github.event.pull_request.base.ref }}\` @ \`${{ github.event.pull_request.base.sha }}\` -> \`${{ github.event.pull_request.head.ref }}\` @ \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert VRT PR comment
        uses: actions/github-script@v8
        env:
          VRT_REPORT_DIR: ${{ env.VRT_REPORT_DIR }}
          ASSET_BASE_URL: ${{ steps.publish_vrt_assets.outputs.asset_base_url }}
          HAS_DIFF: ${{ steps.vrt_report_summary.outputs.has_diff }}
          FAILED_COUNT: ${{ steps.vrt_report_summary.outputs.failed }}
          ADDED_COUNT: ${{ steps.vrt_report_summary.outputs.added }}
          DELETED_COUNT: ${{ steps.vrt_report_summary.outputs.deleted }}
          PASSED_COUNT: ${{ steps.vrt_report_summary.outputs.passed }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- vrt-report -->';
            const assetBaseUrl = process.env.ASSET_BASE_URL;
            const baseRef = process.env.BASE_REF;
            const baseSha = process.env.BASE_SHA.slice(0, 7);
            const headRef = process.env.HEAD_REF;
            const headSha = process.env.HEAD_SHA.slice(0, 7);
            const hasDiff = process.env.HAS_DIFF === 'true';
            const status = hasDiff ? '差分あり' : '差分なし';

            const reportPath = path.join(process.env.VRT_REPORT_DIR, 'reg.json');
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const failedItems = report.failedItems || [];
            const newItems = report.newItems || [];
            const deletedItems = report.deletedItems || [];
            const changedItems = [
              ...failedItems,
              ...newItems,
              ...deletedItems,
            ];
            const newItemSet = new Set(newItems);
            const deletedItemSet = new Set(deletedItems);
            const maxInlineItems = 12;
            const imageWidth = 220;

            function textCell(text) {
              return `<td width="${imageWidth}" align="center">${text}</td>`;
            }

            function imageCell(content) {
              return `<td width="${imageWidth}" align="center">${content}</td>`;
            }

            function assetImage(kind, fileName, width = imageWidth, fallback = 'N/A') {
              if (!assetBaseUrl) return fallback;
              const localPath = path.join(process.env.VRT_REPORT_DIR, kind, fileName);
              if (!fs.existsSync(localPath)) return fallback;
              const assetName = `${kind}_${fileName}`;
              const url = `${assetBaseUrl}/${encodeURIComponent(assetName)}`;
              return `<img src="${url}" alt="${kind} ${fileName}" width="${width}">`;
            }

            function beforeCell(fileName) {
              if (newItemSet.has(fileName)) return textCell('No baseline');
              return imageCell(assetImage('base', fileName));
            }

            function afterCell(fileName) {
              if (deletedItemSet.has(fileName)) return textCell('Removed');
              return imageCell(assetImage('head', fileName));
            }

            function diffCell(fileName) {
              if (newItemSet.has(fileName) || deletedItemSet.has(fileName)) return textCell('N/A');
              return imageCell(assetImage('diff', fileName));
            }

            function imageTable(fileName) {
              return [
                '<table>',
                '  <thead>',
                '    <tr>',
                `      <th width="${imageWidth}">Base</th>`,
                `      <th width="${imageWidth}">Head</th>`,
                `      <th width="${imageWidth}">Diff</th>`,
                '    </tr>',
                '  </thead>',
                '  <tbody>',
                '    <tr>',
                `      ${beforeCell(fileName)}`,
                `      ${afterCell(fileName)}`,
                `      ${diffCell(fileName)}`,
                '    </tr>',
                '  </tbody>',
                '</table>',
              ].join('\n');
            }

            const imageSections = [];
            if (!hasDiff) {
              imageSections.push('差分画像はありません。');
            } else if (!assetBaseUrl) {
              imageSections.push('差分画像はPRコメントへ埋め込めませんでした。');
            } else {
              for (const fileName of changedItems.slice(0, maxInlineItems)) {
                imageSections.push(`##### \`${fileName}\``);
                imageSections.push(imageTable(fileName));
                imageSections.push('');
              }
              if (changedItems.length > maxInlineItems) {
                imageSections.push(
                  `他 ${changedItems.length - maxInlineItems} 件はコメント上限のため省略しました。`,
                );
              }
            }

            const body = [
              marker,
              '### スクリーンショット差分',
              '',
              `- **結果: ${status}**`,
              `- 変更: ${process.env.FAILED_COUNT}件 / 追加: ${process.env.ADDED_COUNT}件 / 削除: ${process.env.DELETED_COUNT}件 / 一致: ${process.env.PASSED_COUNT}件`,
              `- \`${baseRef}\` @ \`${baseSha}\` -> \`${headRef}\` @ \`${headSha}\``,
              '',
              ...imageSections,
              '',
              `_run #${context.runNumber} で更新_`,
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
