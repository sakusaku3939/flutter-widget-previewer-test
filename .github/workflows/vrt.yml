name: vrt

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  vrt:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      VRT_REPORT_DIR: /tmp/vrt-report

    steps:
      - name: Checkout push ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: flutter pub get

      - name: Analyze
        if: github.event_name != 'pull_request'
        run: flutter analyze

      - name: Generate screenshots
        if: github.event_name != 'pull_request'
        run: flutter test test/vrt/previews_vrt_test.dart --update-goldens

      - name: Generate base VRT screenshots
        if: github.event_name == 'pull_request'
        run: |
          rm -rf "$VRT_REPORT_DIR"
          mkdir -p "$VRT_REPORT_DIR/expected" "$VRT_REPORT_DIR/actual" "$VRT_REPORT_DIR/diff"
          flutter pub get
          test_path="$(
            find test -type f \( -name 'previews_vrt_test.dart' -o -name 'previews_golden_test.dart' \) |
              sort |
              head -n 1
          )"
          flutter test "$test_path" --update-goldens
          find test -path '*/ci/*.png' -exec cp {} "$VRT_REPORT_DIR/expected/" \;

      - name: Checkout head ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install head dependencies
        if: github.event_name == 'pull_request'
        run: flutter pub get

      - name: Analyze head
        if: github.event_name == 'pull_request'
        run: flutter analyze

      - name: Generate head VRT screenshots
        if: github.event_name == 'pull_request'
        run: |
          test_path="$(
            find test -type f \( -name 'previews_vrt_test.dart' -o -name 'previews_golden_test.dart' \) |
              sort |
              head -n 1
          )"
          flutter test "$test_path" --update-goldens
          find test -path '*/ci/*.png' -exec cp {} "$VRT_REPORT_DIR/actual/" \;

      - name: Generate VRT diff report
        if: github.event_name == 'pull_request'
        run: dart run tool/compare_vrt_images.dart "$VRT_REPORT_DIR/actual" "$VRT_REPORT_DIR/expected" "$VRT_REPORT_DIR/diff" -J "$VRT_REPORT_DIR/reg.json"

      - name: Summarize VRT report
        if: github.event_name == 'pull_request'
        id: vrt_report_summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.VRT_REPORT_DIR, 'reg.json'), 'utf8'),
          );
          const failed = report.failedItems?.length ?? 0;
          const added = report.newItems?.length ?? 0;
          const deleted = report.deletedItems?.length ?? 0;
          const passed = report.passedItems?.length ?? 0;
          const changed = failed + added + deleted;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `added=${added}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deleted=${deleted}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_diff=${changed > 0}\n`);
          NODE

      - name: Upload VRT images
        if: github.event_name == 'pull_request'
        id: vrt_report
        uses: actions/upload-artifact@v4
        with:
          name: vrt-images-${{ github.run_id }}
          path: ${{ env.VRT_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish VRT images to GitHub Release
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.vrt_report_summary.outputs.has_diff == 'true'
        id: release_assets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          tag="vrt-pr-${PR_NUMBER}-${short_sha}"
          release_title="VRT images for PR #${PR_NUMBER} ${short_sha}"
          upload_dir="${RUNNER_TEMP}/vrt-release-assets"

          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          for kind in expected actual diff; do
            if [ -d "$VRT_REPORT_DIR/$kind" ]; then
              while IFS= read -r -d '' file; do
                cp "$file" "$upload_dir/${kind}_$(basename "$file")"
              done < <(find "$VRT_REPORT_DIR/$kind" -maxdepth 1 -type f -name '*.png' -print0)
            fi
          done

          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$REPOSITORY" \
              --target "$HEAD_SHA" \
              --title "$release_title" \
              --notes "Temporary VRT image assets for PR #${PR_NUMBER}." \
              --prerelease \
              --latest=false
          fi

          shopt -s nullglob
          assets=("$upload_dir"/*.png)
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "$tag" "${assets[@]}" --repo "$REPOSITORY" --clobber
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          echo "asset_base_url=https://github.com/${REPOSITORY}/releases/download/${tag}" >> "$GITHUB_OUTPUT"

      - name: Add VRT report summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### スクリーンショット差分" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[差分画像artifactを確認する](${{ steps.vrt_report.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.vrt_report_summary.outputs.has_diff }}" = "true" ]; then
            echo "- **結果: 差分あり**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **結果: 差分なし**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.release_assets.outputs.url }}" ]; then
            echo "- Release assets: ${{ steps.release_assets.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- 変更: ${{ steps.vrt_report_summary.outputs.failed }}件 / 追加: ${{ steps.vrt_report_summary.outputs.added }}件 / 削除: ${{ steps.vrt_report_summary.outputs.deleted }}件 / 一致: ${{ steps.vrt_report_summary.outputs.passed }}件" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ github.event.pull_request.base.ref }}\` @ \`${{ github.event.pull_request.base.sha }}\` -> \`${{ github.event.pull_request.head.ref }}\` @ \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert VRT report PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          VRT_REPORT_DIR: ${{ env.VRT_REPORT_DIR }}
          ASSET_BASE_URL: ${{ steps.release_assets.outputs.asset_base_url }}
          HAS_DIFF: ${{ steps.vrt_report_summary.outputs.has_diff }}
          FAILED_COUNT: ${{ steps.vrt_report_summary.outputs.failed }}
          ADDED_COUNT: ${{ steps.vrt_report_summary.outputs.added }}
          DELETED_COUNT: ${{ steps.vrt_report_summary.outputs.deleted }}
          PASSED_COUNT: ${{ steps.vrt_report_summary.outputs.passed }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- vrt-report -->';
            const assetBaseUrl = process.env.ASSET_BASE_URL;
            const baseRef = process.env.BASE_REF;
            const baseSha = process.env.BASE_SHA.slice(0, 7);
            const headRef = process.env.HEAD_REF;
            const headSha = process.env.HEAD_SHA.slice(0, 7);
            const hasDiff = process.env.HAS_DIFF === 'true';
            const status = hasDiff ? '差分あり' : '差分なし';

            const reportPath = path.join(process.env.VRT_REPORT_DIR, 'reg.json');
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const changedItems = [
              ...(report.failedItems || []),
              ...(report.newItems || []),
              ...(report.deletedItems || []),
            ];
            const maxInlineItems = 12;

            function assetImage(kind, fileName, width = 220) {
              if (!assetBaseUrl) return '-';
              const localPath = path.join(process.env.VRT_REPORT_DIR, kind, fileName);
              if (!fs.existsSync(localPath)) return '-';
              const assetName = `${kind}_${fileName}`;
              const url = `${assetBaseUrl}/${encodeURIComponent(assetName)}`;
              return `<img src="${url}" alt="${kind} ${fileName}" width="${width}">`;
            }

            const imageSections = [];
            if (assetBaseUrl && changedItems.length > 0) {
              for (const fileName of changedItems.slice(0, maxInlineItems)) {
                imageSections.push(`##### \`${fileName}\``);
                imageSections.push('| Before | After | Diff |');
                imageSections.push('| --- | --- | --- |');
                imageSections.push(
                  [
                    assetImage('expected', fileName),
                    assetImage('actual', fileName),
                    assetImage('diff', fileName),
                  ].join(' | '),
                );
                imageSections.push('');
              }
              if (changedItems.length > maxInlineItems) {
                imageSections.push(
                  `他 ${changedItems.length - maxInlineItems} 件はコメント上限のため省略しました。`,
                );
              }
            }

            const body = [
              marker,
              '### スクリーンショット差分',
              '',
              `- **結果: ${status}**`,
              `- 変更: ${process.env.FAILED_COUNT}件 / 追加: ${process.env.ADDED_COUNT}件 / 削除: ${process.env.DELETED_COUNT}件 / 一致: ${process.env.PASSED_COUNT}件`,
              `- \`${baseRef}\` @ \`${baseSha}\` -> \`${headRef}\` @ \`${headSha}\``,
              '',
              ...(imageSections.length > 0
                ? imageSections
                : ['差分画像はPRコメントへ埋め込めませんでした。']),
              '',
              `_run #${context.runNumber} で更新_`,
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup-vrt-releases:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary VRT releases
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          prefix="vrt-pr-${PR_NUMBER}-"
          gh release list \
            --repo "$REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq ".[] | select(.tagName | startswith(\"$prefix\")) | .tagName" |
          while IFS= read -r tag; do
            gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes
          done
