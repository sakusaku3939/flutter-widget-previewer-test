name: vrt

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  vrt:
    runs-on: ubuntu-latest
    env:
      VRT_REPORT_DIR: /tmp/vrt-report
      PAGES_BRANCH: vrt/screenshot-reports
      PAGES_PATH: docs

    steps:
      - name: Checkout push ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: flutter pub get

      - name: Analyze
        if: github.event_name != 'pull_request'
        run: flutter analyze

      - name: Generate screenshots
        if: github.event_name != 'pull_request'
        run: flutter test test/vrt/previews_vrt_test.dart --update-goldens

      - name: Generate base VRT screenshots
        if: github.event_name == 'pull_request'
        run: |
          rm -rf "$VRT_REPORT_DIR"
          mkdir -p "$VRT_REPORT_DIR/expected" "$VRT_REPORT_DIR/actual" "$VRT_REPORT_DIR/diff"
          flutter pub get
          flutter test test/vrt/previews_vrt_test.dart --update-goldens
          cp test/vrt/goldens/ci/*.png "$VRT_REPORT_DIR/expected/"

      - name: Checkout head ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install head dependencies
        if: github.event_name == 'pull_request'
        run: flutter pub get

      - name: Analyze head
        if: github.event_name == 'pull_request'
        run: flutter analyze

      - name: Generate head VRT screenshots
        if: github.event_name == 'pull_request'
        run: |
          flutter test test/vrt/previews_vrt_test.dart --update-goldens
          cp test/vrt/goldens/ci/*.png "$VRT_REPORT_DIR/actual/"

      - name: Generate VRT HTML report
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.VRT_REPORT_DIR }}
        run: npx --yes reg-cli@0.18.16 actual expected diff -J reg.json -R index.html -I

      - name: Summarize VRT report
        if: github.event_name == 'pull_request'
        id: vrt_report_summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.VRT_REPORT_DIR, 'reg.json'), 'utf8'),
          );
          const failed = report.failedItems?.length ?? 0;
          const added = report.newItems?.length ?? 0;
          const deleted = report.deletedItems?.length ?? 0;
          const passed = report.passedItems?.length ?? 0;
          const changed = failed + added + deleted;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `added=${added}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deleted=${deleted}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_diff=${changed > 0}\n`);
          NODE

      - name: Upload VRT HTML report
        if: github.event_name == 'pull_request'
        id: vrt_report
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report-${{ github.run_id }}
          path: ${{ env.VRT_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish VRT report to GitHub Pages branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: publish_pages
        run: |
          set -euo pipefail

          relative_report_path="vrt/pr-${{ github.event.pull_request.number }}"
          publish_root="${RUNNER_TEMP}/pages-source"
          mkdir -p "$publish_root"

          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGES_BRANCH" --depth=1
            git worktree add "$publish_root" FETCH_HEAD
          else
            git worktree add --detach "$publish_root"
            cd "$publish_root"
            git switch --orphan "$PAGES_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi

          target_dir="$publish_root/$PAGES_PATH/$relative_report_path"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          touch "$publish_root/$PAGES_PATH/.nojekyll"
          cp -R "$VRT_REPORT_DIR"/. "$target_dir"/

          cd "$publish_root"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAGES_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Update VRT report for PR #${{ github.event.pull_request.number }} [skip ci]"
            git push origin "HEAD:$PAGES_BRANCH"
          fi

          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$relative_report_path/" >> "$GITHUB_OUTPUT"

      - name: Add VRT report summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### スクリーンショット差分" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[差分画像を確認する](${{ steps.publish_pages.outputs.url || steps.vrt_report.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.vrt_report_summary.outputs.has_diff }}" = "true" ]; then
            echo "- **結果: 差分あり**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **結果: 差分なし**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- 変更: ${{ steps.vrt_report_summary.outputs.failed }}件 / 追加: ${{ steps.vrt_report_summary.outputs.added }}件 / 削除: ${{ steps.vrt_report_summary.outputs.deleted }}件 / 一致: ${{ steps.vrt_report_summary.outputs.passed }}件" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ github.event.pull_request.base.ref }}\` @ \`${{ github.event.pull_request.base.sha }}\` -> \`${{ github.event.pull_request.head.ref }}\` @ \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert VRT report PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- vrt-report -->';
            const artifactUrl = '${{ steps.vrt_report.outputs.artifact-url }}';
            const pagesUrl = '${{ steps.publish_pages.outputs.url }}';
            const reportUrl = pagesUrl || artifactUrl;
            const baseRef = '${{ github.event.pull_request.base.ref }}';
            const baseSha = '${{ github.event.pull_request.base.sha }}'.slice(0, 7);
            const headRef = '${{ github.event.pull_request.head.ref }}';
            const headSha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const hasDiff = '${{ steps.vrt_report_summary.outputs.has_diff }}' === 'true';
            const status = hasDiff ? '差分あり' : '差分なし';
            const body = [
              marker,
              '### スクリーンショット差分',
              '',
              `[差分画像を確認する](${reportUrl})`,
              '',
              `- **結果: ${status}**`,
              `- 変更: ${{ steps.vrt_report_summary.outputs.failed }}件 / 追加: ${{ steps.vrt_report_summary.outputs.added }}件 / 削除: ${{ steps.vrt_report_summary.outputs.deleted }}件 / 一致: ${{ steps.vrt_report_summary.outputs.passed }}件`,
              `- \`${baseRef}\` @ \`${baseSha}\` -> \`${headRef}\` @ \`${headSha}\``,
              '',
              `_run #${context.runNumber} で更新_`,
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
