name: golden

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pages: write
  pull-requests: write
  id-token: write

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      GOLDEN_REPORT_DIR: /tmp/golden-reg-report

    steps:
      - name: Checkout push ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: flutter pub get

      - name: Analyze
        if: github.event_name != 'pull_request'
        run: flutter analyze

      - name: Run golden tests
        if: github.event_name != 'pull_request'
        run: flutter test test/goldens/previews_golden_test.dart --tags golden

      - name: Generate base goldens
        if: github.event_name == 'pull_request'
        run: |
          rm -rf "$GOLDEN_REPORT_DIR"
          mkdir -p "$GOLDEN_REPORT_DIR/expected" "$GOLDEN_REPORT_DIR/actual" "$GOLDEN_REPORT_DIR/diff"
          flutter pub get
          flutter test test/goldens/previews_golden_test.dart --update-goldens
          cp test/goldens/goldens/ci/*.png "$GOLDEN_REPORT_DIR/expected/"

      - name: Checkout head ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install head dependencies
        if: github.event_name == 'pull_request'
        run: flutter pub get

      - name: Analyze head
        if: github.event_name == 'pull_request'
        run: flutter analyze

      - name: Verify committed head goldens
        if: github.event_name == 'pull_request'
        id: verify_goldens
        continue-on-error: true
        run: flutter test test/goldens/previews_golden_test.dart --tags golden

      - name: Generate head goldens
        if: github.event_name == 'pull_request'
        run: |
          flutter test test/goldens/previews_golden_test.dart --update-goldens
          cp test/goldens/goldens/ci/*.png "$GOLDEN_REPORT_DIR/actual/"

      - name: Generate golden HTML report
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.GOLDEN_REPORT_DIR }}
        run: npx --yes reg-cli@0.18.16 actual expected diff -J reg.json -R index.html -I

      - name: Summarize golden report
        if: github.event_name == 'pull_request'
        id: golden_report_summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.GOLDEN_REPORT_DIR, 'reg.json'), 'utf8'),
          );
          const failed = report.failedItems?.length ?? 0;
          const added = report.newItems?.length ?? 0;
          const deleted = report.deletedItems?.length ?? 0;
          const passed = report.passedItems?.length ?? 0;
          const changed = failed + added + deleted;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `added=${added}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deleted=${deleted}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_diff=${changed > 0}\n`);
          NODE

      - name: Upload golden HTML report
        if: github.event_name == 'pull_request'
        id: golden_report
        uses: actions/upload-artifact@v4
        with:
          name: golden-reg-report-${{ github.run_id }}
          path: ${{ env.GOLDEN_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.GOLDEN_REPORT_DIR }}

      - name: Deploy golden report to GitHub Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: deploy_pages
        uses: actions/deploy-pages@v4

      - name: Add golden report summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### Golden差分" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`${{ github.event.pull_request.base.ref }}\` @ \`${{ github.event.pull_request.base.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Head: \`${{ github.event.pull_request.head.ref }}\` @ \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Changed | ${{ steps.golden_report_summary.outputs.failed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Added | ${{ steps.golden_report_summary.outputs.added }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deleted | ${{ steps.golden_report_summary.outputs.deleted }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unchanged | ${{ steps.golden_report_summary.outputs.passed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HTMLレポート:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy_pages.outputs.page_url || steps.golden_report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert golden report PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- golden-reg-cli-report -->';
            const artifactUrl = '${{ steps.golden_report.outputs.artifact-url }}';
            const pagesUrl = '${{ steps.deploy_pages.outputs.page_url }}';
            const reportUrl = pagesUrl || artifactUrl;
            const baseRef = '${{ github.event.pull_request.base.ref }}';
            const baseSha = '${{ github.event.pull_request.base.sha }}'.slice(0, 7);
            const headRef = '${{ github.event.pull_request.head.ref }}';
            const headSha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const hasDiff = '${{ steps.golden_report_summary.outputs.has_diff }}' === 'true';
            const verificationFailed = '${{ steps.verify_goldens.outcome }}' === 'failure';
            const status = hasDiff ? '差分あり' : '差分なし';
            const verification = verificationFailed
              ? 'golden画像の更新が必要です。'
              : 'golden画像は最新です。';
            const body = [
              marker,
              '### Golden差分',
              '',
              `結果: **${status}**`,
              verification,
              '',
              `Base: \`${baseRef}\` @ \`${baseSha}\``,
              `Head: \`${headRef}\` @ \`${headSha}\``,
              '',
              '| 種別 | 件数 |',
              '| --- | ---: |',
              `| 変更 | ${{ steps.golden_report_summary.outputs.failed }} |`,
              `| 追加 | ${{ steps.golden_report_summary.outputs.added }} |`,
              `| 削除 | ${{ steps.golden_report_summary.outputs.deleted }} |`,
              `| 一致 | ${{ steps.golden_report_summary.outputs.passed }} |`,
              '',
              `HTMLレポート: ${reportUrl}`,
              '',
              `_run #${context.runNumber} で更新_`,
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail when committed head goldens are stale
        if: github.event_name == 'pull_request' && steps.verify_goldens.outcome == 'failure'
        run: exit 1
