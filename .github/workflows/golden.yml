name: golden

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  golden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run golden tests
        run: flutter test test/goldens/previews_golden_test.dart --tags golden

      - name: Prepare reg-cli report input
        if: failure()
        run: dart run tool/generate_reg_cli_golden_report.dart

      - name: Generate golden HTML report
        if: failure()
        working-directory: build/golden-reg-report
        run: npx --yes reg-cli@0.18.16 -F reg.json -R index.html

      - name: Upload golden HTML report
        if: failure()
        id: golden_report
        uses: actions/upload-artifact@v4
        with:
          name: golden-reg-report-${{ github.run_id }}
          path: build/golden-reg-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Add golden report summary
        if: failure()
        run: |
          echo "### Golden test report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the HTML report artifact:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.golden_report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert golden report PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- golden-reg-cli-report -->';
            const artifactUrl = '${{ steps.golden_report.outputs.artifact-url }}';
            const body = [
              marker,
              '### Golden test report',
              '',
              `Golden tests failed in [run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              `Download the HTML report artifact: ${artifactUrl}`,
              '',
              '_This comment is updated on each golden report failure._',
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
